<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 290px;
        margin: 0;
        padding: 14px;
        background: radial-gradient(circle at 20% -20%, #2a2113, #0c0d10 60%);
        color: #f2e4c4;
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        color: #d5a94e;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      p.sub {
        margin: 0 0 12px;
        font-size: 11.5px;
        color: #b8ad93;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: #b8ad93;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid #3a3524;
        background: #16171c;
        color: #f2e4c4;
        font-size: 13px;
      }
      input:focus {
        outline: none;
        border-color: #d5a94e;
      }
      button.primary {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        border: 1px solid #d5a94e;
        border-radius: 8px;
        background: linear-gradient(180deg, #1a1b20, #0c0d10);
        color: #f2e4c4;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary:hover {
        background: #22232a;
      }
      button.primary:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        margin-top: 10px;
        font-size: 11.5px;
        min-height: 15px;
      }
      .status.error {
        color: #fca5a5;
      }
      .status.ok {
        color: #86efac;
      }
      .foot {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #26241b;
        font-size: 11px;
        color: #8a8168;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .foot a {
        color: #b8ad93;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1><span>⚒</span> Ascension Build Importer</h1>
    <p class="sub">
      Or open any armory page on Darkmoon Logs and use the on-page button.
    </p>

    <label for="name">Name, character id, or armory / report URL</label>
    <input
      id="name"
      type="text"
      placeholder="Imissyou  ·  or a /reports/…?source=6046 link"
      autofocus
    />
    <button class="primary" id="go">Open in Builder</button>

    <div class="status" id="status"></div>

    <label for="webapp" style="margin-top:14px">My builder URL (self-hosted)</label>
    <input
      id="webapp"
      type="text"
      placeholder="https://builds.wrawn.com  (blank = public builder)"
    />
    <div class="sub" style="margin-top:6px">
      Set this and the on-page button sends builds to your own site (saved there).
    </div>

    <div class="foot">
      <span id="catalog-info">Catalog: …</span>
      <a id="refresh">Refresh catalog</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
