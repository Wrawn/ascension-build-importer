<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved builds — Ascension Build Importer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: radial-gradient(circle at 20% -10%, #2a2113, #0c0d10 60%);
        color: #f2e4c4;
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        max-width: 1100px;
        margin: 0 auto 18px;
        flex-wrap: wrap;
      }
      h1 { margin: 0; font-size: 20px; color: #d5a94e; }
      a.back { color: #b8ad93; text-decoration: none; font-size: 13px; }
      a.back:hover { color: #f2e4c4; text-decoration: underline; }
      .count { color: #8a8168; font-size: 13px; }
      .wrap { max-width: 1100px; margin: 0 auto; }
      .card {
        border: 1px solid #26241b;
        border-radius: 12px;
        background: #141319;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .row1 {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .label-input {
        flex: 1;
        min-width: 160px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #3a3524;
        background: #101116;
        color: #f2e4c4;
        font-size: 14px;
        font-weight: 600;
      }
      .label-input::placeholder { color: #6f684f; font-weight: 400; font-style: italic; }
      .char { color: #b8ad93; font-size: 13px; white-space: nowrap; }
      .char b { color: #f2e4c4; }
      .meta { color: #8a8168; font-size: 12px; margin: 8px 0; }
      .meta .pill {
        display: inline-block;
        border: 1px solid #2f2b1e;
        border-radius: 999px;
        padding: 1px 8px;
        margin-right: 6px;
        color: #cbb98a;
      }
      .lists { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 4px; }
      .lists section { flex: 1; min-width: 220px; }
      .lists h3 {
        margin: 0 0 4px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.5px; color: #8a8168;
      }
      .lists div { font-size: 12.5px; color: #d8cba6; }
      .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      button, a.btn {
        border: 1px solid #3a3524;
        background: #1a1b20;
        color: #f2e4c4;
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      button:hover, a.btn:hover { background: #24252c; }
      a.btn.gold { border-color: #d5a94e; color: #f2e4c4; }
      button.danger { border-color: #7f2f2f; color: #fca5a5; }
      button.danger:hover { background: #2a1414; }
      .empty { color: #8a8168; text-align: center; padding: 60px 0; }
      .toast {
        position: fixed; right: 18px; bottom: 18px; z-index: 10;
        background: #14263a; color: #dbeafe; border: 1px solid #2f5c8a;
        padding: 10px 14px; border-radius: 9px; font-size: 13px;
        opacity: 0; transform: translateY(6px); transition: .15s;
      }
      .toast.show { opacity: 1; transform: none; }
      .toast.err { background: #3a1414; color: #fecaca; border-color: #8a2f2f; }
      .section-h {
        max-width: 1100px; margin: 22px auto 10px; font-size: 13px;
        text-transform: uppercase; letter-spacing: 1px; color: #8a8168;
        border-bottom: 1px solid #26241b; padding-bottom: 6px;
      }
      .gcard { border: 1px solid #3a3524; border-left: 3px solid #d5a94e; }
      .ghead { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .gtitle { font-weight: 700; color: #f2e4c4; font-size: 15px; }
      .gsub { color: #b8ad93; font-size: 12.5px; }
      .gcaret { color: #d5a94e; transition: transform .15s; margin-left: auto; font-size: 12px; }
      .gcard.open .gcaret { transform: rotate(90deg); }
      .gcounts .pill { border-color: #3a3524; }
      .gmembers { margin-top: 12px; display: none; }
      .gcard.open .gmembers { display: block; }
      .rolegrp { margin-top: 10px; }
      .rolegrp h4 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: .6px; text-transform: uppercase;
      }
      .rolegrp.tank h4 { color: #9ec5ff; }
      .rolegrp.healer h4 { color: #86efac; }
      .rolegrp.dps h4 { color: #fca5a5; }
      .member {
        display: flex; align-items: center; gap: 10px; padding: 5px 8px;
        border-radius: 7px;
      }
      .member:hover { background: #1b1c22; }
      .member .mname { font-weight: 600; min-width: 150px; }
      .member .mspec { color: #8a8168; font-size: 12px; flex: 1; }
      .member .mcount { color: #b8ad93; font-size: 12px; }
      .member .mtp {
        color: #d5a94e; font-size: 12px; font-weight: 600; min-width: 92px; text-align: right;
      }
      .member a.btn { padding: 4px 9px; font-size: 12px; }
      .member .unavail { color: #8a6f6f; font-size: 12px; font-style: italic; }
      .glabel { max-width: 260px; }
      .bucket-pill { border-color: #4a3d66 !important; color: #b9a7ff !important; }
      .ro-label { font-weight: 700; color: #f2e4c4; font-size: 14px; }
      .bbar {
        max-width: 1100px; margin: 8px auto 4px; display: flex; align-items: center;
        gap: 10px; flex-wrap: wrap; background: #141319; border: 1px solid #26241b;
        border-radius: 10px; padding: 12px 14px;
      }
      .bbar-l { color: #b8ad93; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
      .bbar .label-input { max-width: 220px; }
      .abi-go2 {
        padding: 8px 14px; border: 1px solid #d5a94e; border-radius: 8px;
        background: #1a1b20; color: #f2e4c4; font-weight: 600; font-size: 13px; cursor: pointer;
      }
      .abi-go2:hover { background: #24252c; }
      .bbar .back { margin-left: auto; }
    </style>
  </head>
  <body>
    <header>
      <h1>⚒ Saved builds</h1>
      <span class="count" id="count"></span>
      <a class="back" href="/#builder">← Back to planner</a>
    </header>
    <div class="wrap">
      <div id="bucketbar" hidden></div>
      <div id="groups-section" hidden>
        <div class="section-h">Raid groups</div>
        <div id="groups"></div>
      </div>
      <div class="section-h" id="builds-h" hidden>Builds</div>
      <div id="list"><div class="empty">Loading…</div></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const listEl = document.getElementById("list");
      const countEl = document.getElementById("count");
      const toastEl = document.getElementById("toast");
      const groupsEl = document.getElementById("groups");
      const groupsSection = document.getElementById("groups-section");
      const buildsH = document.getElementById("builds-h");

      function toast(msg, err) {
        toastEl.textContent = msg;
        toastEl.className = "toast show" + (err ? " err" : "");
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => (toastEl.className = "toast"), 3000);
      }
      const esc = (s) =>
        String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      const fmtDate = (s) => { try { return new Date(s).toLocaleString(); } catch { return s; } };

      const TOKEN_KEY = "abi-admin-token";
      const getToken = () => localStorage.getItem(TOKEN_KEY) || "";
      function authHeaders(extra) {
        const h = { ...(extra || {}) };
        const t = getToken();
        if (t) h["x-admin-token"] = t;
        return h;
      }
      async function api(path, body) {
        const res = await fetch(path, body ? {
          method: "POST",
          headers: authHeaders({ "content-type": "application/json" }),
          body: JSON.stringify(body),
        } : { headers: authHeaders() });
        return { status: res.status, data: await res.json().catch(() => ({})) };
      }

      function bucketPill(rec, show) {
        if (!show) return "";
        const bs = (rec.buckets || []);
        const label = bs.length ? esc(bs.join(", ")) : "—";
        return `<span class="pill bucket-pill">bucket: ${label}</span>`;
      }

      function card(b, opts = {}) {
        const { readonly = false, showBucket = false } = opts;
        const el = document.createElement("div");
        el.className = "card";
        const cap = b.primaryToken ? b.primaryToken[0].toUpperCase() + b.primaryToken.slice(1) : "—";
        const labelField = readonly
          ? `<span class="ro-label">${esc(b.label || b.name)}</span>`
          : `<input class="label-input" placeholder="Name this build…" value="${esc(b.label || "")}" />`;
        el.innerHTML = `
          <div class="row1">
            ${labelField}
            <span class="char">char: <b>${esc(b.name)}</b>${b.characterId ? " · #" + esc(b.characterId) : ""}</span>
          </div>
          <div class="meta">
            <span class="pill">${b.abilityCount} abilities</span>
            <span class="pill">${b.talentCount} talents</span>
            <span class="pill">${esc(cap)}</span>
            ${bucketPill(b, showBucket)}
            <span class="pill">imported ${b.importCount}×</span>
            last import: ${esc(fmtDate(b.lastImported))}
            &nbsp;·&nbsp; last build update: ${b.capturedAt ? esc(fmtDate(b.capturedAt)) : "—"}
          </div>
          <div class="lists">
            <section><h3>Abilities</h3><div>${esc((b.abilities || []).join(", ")) || "—"}</div></section>
            <section><h3>Talents</h3><div>${esc((b.talents || []).join(", ")) || "—"}</div></section>
          </div>
          <div class="actions">
            <a class="btn gold" href="/#saved=${encodeURIComponent(b.key)}">Open in planner</a>
            <a class="btn" href="/#b=${esc(b.payload)}" target="_blank" rel="noopener">Preview link</a>
            <button data-act="copy">Copy IDs</button>
            ${readonly ? "" : '<button class="danger" data-act="delete">Delete</button>'}
          </div>`;

        el.querySelector('[data-act="copy"]').addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(b.flat); toast("Spell IDs copied."); }
          catch { toast("Copy failed — select manually.", true); }
        });

        if (!readonly) {
          const input = el.querySelector(".label-input");
          let lastSaved = b.label || "";
          const saveLabel = async () => {
            if (input.value === lastSaved) return;
            const { data } = await api("/api/builds/label", { key: b.key, label: input.value });
            if (data.ok) { lastSaved = input.value; toast("Name saved."); }
            else toast(data.error || "Failed to save name.", true);
          };
          input.addEventListener("blur", saveLabel);
          input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
          el.querySelector('[data-act="delete"]').addEventListener("click", async () => {
            if (!confirm(`Delete this saved build for ${b.name}?`)) return;
            const { data } = await api("/api/builds/delete", { key: b.key });
            if (data.ok) { el.remove(); toast("Deleted."); load(true); }
            else toast(data.error || "Delete failed.", true);
          });
        }
        return el;
      }

      function groupCard(g, opts = {}) {
        const { readonly = false, showBucket = false } = opts;
        const el = document.createElement("div");
        el.className = "card gcard";
        const members = g.members || [];
        const byRole = (r) => members.filter((m) => m.role === r);
        const t = byRole("tank"), h = byRole("healer"), d = byRole("dps");
        const saved = members.filter((m) => m.saved).length;
        const date = g.date ? fmtDate(g.date).split(",")[0] : "";
        const diff = g.difficulty ? g.difficulty[0].toUpperCase() + g.difficulty.slice(1) : "";
        const title = g.label || ((g.zone || "Raid") + (date ? " — " + date : ""));
        const subParts = [diff, g.title, "report #" + g.reportId].filter(Boolean);

        el.innerHTML = `
          <div class="ghead">
            <div>
              <div class="gtitle">${esc(title)}</div>
              <div class="gsub">${esc(subParts.join(" · "))}</div>
            </div>
            <span class="gcaret">▶</span>
          </div>
          <div class="meta gcounts">
            <span class="pill">${members.length} players</span>
            <span class="pill">${t.length} tank</span>
            <span class="pill">${h.length} healer</span>
            <span class="pill">${d.length} dps</span>
            <span class="pill">${saved} builds saved</span>
            ${bucketPill(g, showBucket)}
            last import: ${esc(fmtDate(g.lastImported))}
          </div>
          <div class="gmembers"></div>`;

        const mwrap = el.querySelector(".gmembers");
        const roleBlock = (label, cls, list) => {
          if (!list.length) return;
          const sec = document.createElement("div");
          sec.className = "rolegrp " + cls;
          sec.innerHTML = `<h4>${label} (${list.length})</h4>`;
          for (const m of list) {
            const row = document.createElement("div");
            row.className = "member";
            const action = m.saved
              ? `<a class="btn gold" href="/#saved=${encodeURIComponent(m.buildKey)}">Open in planner</a>`
              : `<span class="unavail">no build captured</span>`;
            const counts = m.saved ? `<span class="mcount">${m.abilityCount}/${m.talentCount}</span>` : "";
            const tpVal = m.role === "healer" ? m.hps : m.dps;
            const tp = tpVal
              ? `<span class="mtp">${Number(tpVal).toLocaleString()} ${m.role === "healer" ? "HPS" : "DPS"}</span>`
              : "";
            row.innerHTML =
              `<span class="mname">${esc(m.name)}</span>` +
              `<span class="mspec">${esc(m.spec || "")}</span>${tp}${counts}${action}`;
            sec.append(row);
          }
          mwrap.append(sec);
        };
        roleBlock("Tanks", "tank", t);
        roleBlock("Healers", "healer", h);
        roleBlock("DPS", "dps", d);

        el.querySelector(".ghead").addEventListener("click", () => el.classList.toggle("open"));

        if (!readonly) {
          const actions = document.createElement("div");
          actions.className = "actions";
          actions.innerHTML =
            `<input class="glabel label-input" placeholder="Name this raid…" value="${esc(g.label || "")}" />` +
            `<button class="danger" data-act="gdelete">Delete group</button>`;
          mwrap.append(actions);

          const gi = actions.querySelector(".glabel");
          let last = g.label || "";
          const save = async () => {
            if (gi.value === last) return;
            const { data } = await api("/api/groups/label", { key: g.key, label: gi.value });
            if (data.ok) { last = gi.value; toast("Group name saved."); }
            else toast(data.error || "Failed to save name.", true);
          };
          gi.addEventListener("blur", save);
          gi.addEventListener("keydown", (e) => { if (e.key === "Enter") gi.blur(); });

          actions.querySelector('[data-act="gdelete"]').addEventListener("click", async () => {
            if (!confirm(`Delete the raid group "${title}"? (The individual builds stay.)`)) return;
            const { data } = await api("/api/groups/delete", { key: g.key });
            if (data.ok) { el.remove(); toast("Group deleted."); load(true); }
            else toast(data.error || "Delete failed.", true);
          });
        }
        return el;
      }

      function renderLists(builds, groups, opts, emptyMsg) {
        groupsSection.hidden = groups.length === 0;
        groupsEl.innerHTML = "";
        for (const g of groups) groupsEl.append(groupCard(g, opts));

        // Builds imported only as part of a raid live under their group, not here.
        const shown = builds
          .filter((b) => b.direct !== false)
          .sort((a, b) =>
            (a.label || a.name || "").localeCompare(b.label || b.name || "", undefined, { sensitivity: "base" })
          );
        buildsH.hidden = shown.length === 0;
        listEl.innerHTML = "";
        if (!shown.length && !groups.length) {
          listEl.innerHTML = emptyMsg || '<div class="empty">Nothing here yet.</div>';
          return;
        }
        for (const b of shown) listEl.append(card(b, opts));
      }

      async function load(silent) {
        const [bRes, gRes] = await Promise.all([api("/api/builds"), api("/api/groups")]);
        if (bRes.status === 403 || gRes.status === 403) return bucketMode(silent);

        document.getElementById("bucketbar").hidden = true;
        const builds = (bRes.data && bRes.data.builds) || [];
        const groups = (gRes.data && gRes.data.groups) || [];
        countEl.textContent =
          builds.length + (builds.length === 1 ? " build" : " builds") +
          (groups.length ? " · " + groups.length + " raid" + (groups.length === 1 ? "" : "s") : "");
        if (silent) return;
        renderLists(builds, groups, { readonly: false, showBucket: true },
          '<div class="empty">Nothing saved yet. Import a character, or paste a report link to save a whole raid.</div>');
      }

      // Friend view: no admin token — show only the builds tagged with a bucket
      // name they type (remembered per browser). No login by design.
      async function bucketMode(silent) {
        const bar = document.getElementById("bucketbar");
        const stored = localStorage.getItem("abi-bucket") || "";
        bar.hidden = false;
        bar.innerHTML =
          `<div class="bbar">` +
          `<span class="bbar-l">Your bucket</span>` +
          `<input id="bkin" class="label-input" placeholder="e.g. your name" value="${esc(stored)}" />` +
          `<button id="bkgo" class="abi-go2">View my builds</button>` +
          `<a id="adminlink" class="back">I'm the admin →</a>` +
          `</div>`;

        const input = document.getElementById("bkin");
        const go = async () => {
          const name = input.value.trim();
          if (!name) {
            countEl.textContent = "";
            groupsSection.hidden = true;
            listEl.innerHTML = '<div class="empty">Enter your bucket name above to see your saved builds.</div>';
            return;
          }
          localStorage.setItem("abi-bucket", name);
          const res = await fetch("/api/bucket?name=" + encodeURIComponent(name));
          const data = await res.json().catch(() => ({}));
          const builds = data.builds || [], groups = data.groups || [];
          countEl.textContent =
            'bucket "' + name + '": ' + builds.length + (builds.length === 1 ? " build" : " builds") +
            (groups.length ? " · " + groups.length + " raid" + (groups.length === 1 ? "" : "s") : "");
          renderLists(builds, groups, { readonly: true, showBucket: false },
            '<div class="empty">Nothing in bucket “' + esc(name) +
            '” yet. In the planner, set this bucket in the import box and import a build.</div>');
        };
        document.getElementById("bkgo").addEventListener("click", go);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
        document.getElementById("adminlink").addEventListener("click", () => {
          const t = prompt("Enter the admin token:");
          if (t) { localStorage.setItem(TOKEN_KEY, t.trim()); load(); }
        });

        if (stored) go();
        else {
          countEl.textContent = "";
          listEl.innerHTML = '<div class="empty">Enter your bucket name above to see your saved builds.</div>';
        }
      }
      load();
    </script>
  </body>
</html>
